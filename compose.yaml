# HostelFlow production stack.
#
# **This stack publishes no ports at all by default.** PostgreSQL, MinIO and the app are
# reachable only over compose networks; the outside world reaches the app through a
# Cloudflare tunnel, which dials out rather than accepting connections. Nothing here can be
# port-scanned, and nothing contends for 80/443 on a server that is already serving other
# sites — which is the situation on the pilot's box.
#
# Two deployment shapes, selected by profile:
#
#   docker compose up -d                       # uses COMPOSE_PROFILES from .env
#   docker compose --profile tunnel up -d      # shared server, Cloudflare tunnel
#   docker compose --profile standalone up -d  # dedicated server, Caddy owns 80/443
#
# `.env` sets COMPOSE_PROFILES=tunnel, so a bare `docker compose up -d` does the right
# thing. Without it that command started the app, database, storage and backup with no
# ingress at all: every service healthy, the site unreachable, and nothing in any log to
# say why.
#
#   docker compose --profile tunnel ps
#   docker compose logs --tail=200 app
#
# See docs/server-deployment.md before the first deployment.

name: hostelflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Named variables rather than `env_file: .env`, which handed every service the whole
    # file — including the tunnel token, which grants takeover of the public hostname and
    # which the app has no use for. Any env disclosure should leak the app's own secrets,
    # not the front door's.
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL}
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-120}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Which front end sits in front of us, and therefore which client-address header
      # can be believed. Hardcoding this to `cloudflare` made the knob documented in
      # .env.example do nothing, and under the standalone profile — where Caddy deletes
      # CF-Connecting-IP — it meant every audit row recorded a NULL address.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-cloudflare}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # No ports, in either profile. Whichever front end is in use — cloudflared or Caddy —
    # reaches the app by service name over the `edge` network. Publishing even
    # 127.0.0.1:3000 would be one more way in for anything else running on a shared host.

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation, so ORDER BY on resident names does not depend on the
      # host's locale.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No ports: the database is never exposed outside this compose network.

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The browser console is not needed in production and is one more login to defend.
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No ports: object storage is reachable only from the app container.

  # Only for a dedicated server, where nothing else wants 80/443.
  #
  # On the pilot's machine another project's nginx container already holds both ports, so
  # starting this would either fail to bind or disrupt a live site. It stays behind a
  # profile rather than being deleted, because a future dedicated box is the simpler
  # topology and this is the configuration for it.
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      # NOTE: with this profile set TRUSTED_PROXY=reverse-proxy in .env. Left at
      # `cloudflare` the app would look for a header Caddy deletes, and record no client
      # address at all.
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # QUIC / HTTP3.
      - "443:443/udp"

  # The public entry point on a shared server.
  #
  # cloudflared makes an OUTBOUND connection to Cloudflare and receives traffic over it, so
  # the host needs no open port, no certificate and no DNS pointing at its IP. Cloudflare
  # terminates TLS and forwards to `app:3000` over the edge network.
  #
  # The tunnel's routing lives in the Cloudflare dashboard, not here: the token is the only
  # thing this server holds. Create the tunnel under Zero Trust > Networks > Tunnels, add a
  # public hostname mapping your domain to http://app:3000, and put the token in .env.
  cloudflared:
    # Pinned like every other image. This is the sole public entry point under the tunnel
    # profile, and `latest` meant a bad upstream release could take the site down with no
    # known-good version recorded to roll back to.
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["tunnel"]
    restart: unless-stopped
    # The token goes in the environment, never in argv. As a command flag it was readable
    # from the host process table — `ps auxww`, /proc/<pid>/cmdline — by any user on a box
    # this project shares with two other applications, and it grants takeover of the
    # public hostname.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    # Only what backup.sh reads. It has no business holding the auth secret or the tunnel
    # token.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DESTINATION: ${BACKUP_DESTINATION:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # bash, not sh: the script relies on `pipefail` to notice a failed pg_dump, which
    # POSIX sh does not provide. Running it under sh silently reinstates the bug where a
    # truncated dump is promoted to a real backup.
    entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      # The mount target follows BACKUP_DESTINATION. Pinning it to /backups while telling
      # operators in .env.example that the destination is configurable meant a changed
      # value wrote backups into the container's ephemeral layer — and logged success.
      - backup-data:${BACKUP_DESTINATION:-/backups}
      - minio-data:/minio-source:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
  # Deliberately a separate volume. Keeping backups inside the database volume means
  # losing both to the same failure. Mirror this off the machine as well; see
  # docs/backup-and-restore.md.
  backup-data:

networks:
  # Caddy to app only.
  edge:
  # App to database and object storage. No route to or from the internet.
  internal:
    internal: true
