name: CI

# Every push, every branch. Two reasons this file matters more than usual here.
#
# A suite that runs nowhere gates nothing: `npm run verify` excludes the Playwright tests
# to stay fast, so without CI they would sit unexecuted until someone remembered them.
#
# And PostgreSQL and MinIO run on the owner's server, not on the development
# machine, so the database integration tests cannot run locally. Without CI they would be
# written and never executed — and CLAUDE.md requires integration tests to pass before a
# branch may merge. GitHub provides a throwaway PostgreSQL service container, so here the
# tests actually run, on every push, publicly.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # postinstall runs prisma generate, which needs only the schema.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Deliberately no secrets: server configuration is validated lazily at request time,
      # so a production build must not require a database URL or an auth secret. If this
      # step ever needs one, that property has regressed.
      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hostelflow_test
          POSTGRES_USER: hostelflow
          POSTGRES_PASSWORD: hostelflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostelflow -d hostelflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable CI database. The suite reads TEST_DATABASE_URL and ignores
      # DATABASE_URL on purpose, so it can never be pointed at a live database by an
      # environment variable that happens to be set.
      TEST_DATABASE_URL: postgresql://hostelflow:hostelflow_ci_password@localhost:5432/hostelflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Proves the migration generated offline actually applies to a real PostgreSQL,
      # including the hand-written append-only triggers.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Verify migrations are in sync with the schema
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Structural seed is idempotent
        run: |
          npm run db:seed
          npm run db:seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
