name: CI

# Every push, every branch. Two reasons this file matters more than usual here.
#
# A suite that runs nowhere gates nothing: `npm run verify` excludes the Playwright tests
# to stay fast, so without CI they would sit unexecuted until someone remembered them.
#
# And PostgreSQL and MinIO run on the owner's server, not on the development
# machine, so the database integration tests cannot run locally. Without CI they would be
# written and never executed — and CLAUDE.md requires integration tests to pass before a
# branch may merge. GitHub provides a throwaway PostgreSQL service container, so here the
# tests actually run, on every push, publicly.

# Pull requests and main only, deliberately.
#
# `push: ["**"]` alongside `pull_request` ran every job twice for any branch with an open
# PR — eight jobs where four were needed, on an account where Actions usage is metered.
# Since main is protected and all work arrives through a pull request, the PR event is the
# one that matters; the main trigger covers the merge commit itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # postinstall runs prisma generate, which needs only the schema.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Deliberately no secrets: server configuration is validated lazily at request time,
      # so a production build must not require a database URL or an auth secret. If this
      # step ever needs one, that property has regressed.
      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hostelflow_test
          POSTGRES_USER: hostelflow
          POSTGRES_PASSWORD: hostelflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostelflow -d hostelflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A disposable CI database.
      #
      # TEST_DATABASE_URL is what the harness itself reads. DATABASE_URL is what the
      # application modules under test read, and the two are set to the same database
      # deliberately — tests/integration/setup.ts refuses to run unless they match, which
      # is what now stops the suite writing to a database somebody had exported for
      # another purpose.
      TEST_DATABASE_URL: postgresql://hostelflow:hostelflow_ci_password@localhost:5432/hostelflow_test

      # The modules under test are real application modules: they build the Prisma client
      # through lib/server/db.ts, which validates the whole server environment. So the
      # integration job runs as a fully configured application pointed at a throwaway
      # database, rather than the modules being weakened to need less.
      #
      # Every value here is disposable and public by design. MinIO is never contacted by
      # these tests; its variables exist only to satisfy validation.
      DATABASE_URL: postgresql://hostelflow:hostelflow_ci_password@localhost:5432/hostelflow_test
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnop
      MINIO_ENDPOINT: localhost
      MINIO_ROOT_USER: ci-not-used
      MINIO_ROOT_PASSWORD: ci-not-used
      MINIO_BUCKET_PRIVATE: ci-not-used

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Proves the migration generated offline actually applies to a real PostgreSQL,
      # including the hand-written append-only triggers.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migrations are in sync with the schema
        run: npx prisma migrate status

      - name: Structural seed is idempotent
        run: |
          npm run db:seed
          npm run db:seed

      - name: Integration tests
        run: npm run test:integration

  image:
    name: Production image builds and can start
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job exists because the first version of the Dockerfile hand-picked which
    # node_modules directories to copy into the runtime stage and got it wrong: tsx was
    # copied without its esbuild dependency, and minio and better-auth were absent
    # entirely. Everything passed lint, types, tests and build — the image simply exited
    # on boot, which nothing in CI would have noticed. The Dockerfile now ends with a
    # require.resolve check for every module the entrypoint needs, so building the image
    # is the test.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hostelflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint refuses to start without a database, which is correct. This checks
      # the layer above that: the operator commands resolve their imports and run.
      - name: Operator scripts are runnable in the image
        run: |
          docker run --rm --entrypoint node hostelflow:ci \
            -e "['minio','better-auth','@prisma/adapter-pg','esbuild'].forEach(m => require.resolve(m)); console.log('runtime modules resolve')"
          docker run --rm --entrypoint node_modules/.bin/tsx hostelflow:ci --version
          docker run --rm --entrypoint node_modules/.bin/prisma hostelflow:ci --version

      - name: Image runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint id hostelflow:ci -un)
          echo "image runs as: $user"
          test "$user" = "node"

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The smoke suite signs in through the real login form now, so it needs a database to
    # sign in to. Without one it would skip every authenticated screen and still report
    # success — a green check that guarded nothing.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hostelflow_e2e
          POSTGRES_USER: hostelflow
          POSTGRES_PASSWORD: hostelflow_ci_password
        options: >-
          --health-cmd "pg_isready -U hostelflow -d hostelflow_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # Only the e2e harness reads this, and it never falls back to DATABASE_URL: this
      # suite runs `migrate deploy` and `db:seed`, so pointing it at the wrong database
      # would rewrite it rather than merely read it.
      E2E_DATABASE_URL: postgresql://hostelflow:hostelflow_ci_password@localhost:5432/hostelflow_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
